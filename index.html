<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>BMI-Calculator</title>
</head>
<body class="montserrat ">
  <body>
<div id="main">
<h1>BMI Calculator</h1>
<form action="" id="form">
<label for "height">Height</label>
<input id="height" type="number"
placeholder="In CM">
<label for="weight">Weight</label>
<input id="weight" type="number"
placeholder="In KG">
<button id="button" type="button">Calculate</button>
</form>
<div class="result">
<h4>Your BMI Score</h4>
<h2 id="score">50.22</h2>
</div>
<div class="info">
<h4 class="poi">BMI Weight Guide</h4>
<p class="yell">Under Weight = Less than 18.6</p>
<p class="green">Normal Range = 18.6 and 24.9</p>
<p class="red">OverWeight = Greater than 24.9</p>
</div>
</div>
<div class="footer-marquee">
  <div class="footer-marquee-text">
    This website is created by S M TAMJID HOSSAIN EPICK
  </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
